name: Build SpreeCore JAR
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand source bundle on first build
        shell: bash
        run: |
          if [ ! -f build.gradle.kts ]; then
            python -m pip install --quiet brotli
            python - <<'PY'
          import base64, brotli, json
          from pathlib import Path
          bundle = json.loads(brotli.decompress(base64.b64decode(Path("source.bundle.b64").read_text())).decode("utf-8"))
          for path, content in bundle.items():
              if path.startswith(".github/") or path.startswith(".local-test/"):
                  continue
              dest = Path(path)
              if dest.is_absolute() or ".." in dest.parts:
                  raise ValueError("Invalid bundle path: " + path)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_text(content, encoding="utf-8")
          print("Expanded", len(bundle), "source files.")
          PY
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add build.gradle.kts settings.gradle.kts build-windows.bat README.md TESTING.md src/
              git diff --cached --quiet || (git commit -m "Publish full SpreeCore Java source" && git push)
            fi
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Compile and run tests
        run: gradle clean test build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SpreeCore-jar
          path: build/libs/*.jar
          if-no-files-found: error
