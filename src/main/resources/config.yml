# SpreeCore 1.6.2 - Capacity Perk (+4 items per inventory stack per copy).
# Save changes automatically from the menu; manual edits use /spreeadmin reload.
# Values labeled hearts use Minecraft HEARTS (two health points per heart).
general:
  prefix: '&9&lSPREE &8| &f'
  max-killstreak: 30
  fractured-label: '&c&lFractured'
  actionbar-interval-ticks: 40
  save-interval-seconds: 120
  announce-joining-streak: 10

# Blue (&9) sword symbol matches menu headings; bold number colors change every five kills.
# Overhead tags use scoreboard suffixes when the player is NOT already in a team.
# Existing faction/party team membership is preserved (no forced team removal).
display:
  streak-indicators:
    tab-enabled: true
    # While the Invisibility potion effect is active, the tab list keeps the
    # last shown killstreak until the effect ends. Actual streak mechanics continue.
    freeze-tab-while-invisible: true
    nametag-enabled: true
    symbol: '⚔'
    fractured-symbol: '✕'
    # Original Spree Skript thresholds; editable in /spree settings.
    # Numbers are always bold; only their colors vary.
    tier-colors:
      '0': '&7'  # 0-4 gray
      '5': '&a'  # 5-9 green
      '10': '&e' # 10-14 yellow
      '15': '&6' # 15-19 gold
      '20': '&c' # 20-24 red
      '25': '&5' # 25-29 purple
      '30': '&4' # 30+ dark red

killstreak:
  # Vanilla is 10 hearts. Each POSITIVE level grants precisely +0.5 heart.
  # Fractured (-1) is treated as 0 here: no health penalty.
  base-health-hearts: 10
  health-per-level-hearts: 0.5
  # Direct mace attacks are unavailable at 0 or Fractured.
  mace-unlock-level: 1
  # All levels are editable in /spree settings > Milestone Buffs.
  # Buffs remain active while at or above the required streak.
  milestones:
    weaving-level: 5
    speed-level: 10
    strength-level: 15
    glowing-level: 20
  # Convert owned streak levels into right-click +1 Spree items.
  withdrawal:
    enabled: true
  anti-farm:
    enabled: true
    same-victim-cooldown-seconds: 300
    block-rewards-for-fractured-victim: true
  revenge:
    enabled: true
    bonus-streak: 2
  # Milestones above are the only current potion perks. The rest of the
  # progression, item unlocks, and temporary event rules are unchanged.

# Two Perk rolls per 5 levels (2, 4, 7, 9, ...).
# Each milestone's roll is stored permanently in players.yml, never rerolled.
# An assigned Perk is active only while the player's current streak reaches
# that exact milestone. Duplicates stack additively up to max-copies.
# 'per-copy' is a FRACTION (0.02 = 2%), except reach (blocks/copy).
perks:
  enabled: true
  power:
    enabled: true
    per-copy: 0.02
    max-copies: 4
  fortitude:
    enabled: true
    per-copy: 0.02
    max-copies: 4
  agility:
    enabled: true
    per-copy: 0.03
    max-copies: 3
  dexterity:
    enabled: true
    per-copy: 0.02
    max-copies: 4
  restoration:
    enabled: true
    per-copy: 0.03
    max-copies: 4
  stability:
    enabled: true
    per-copy: 0.04
    max-copies: 4
  endurance:
    enabled: true
    per-copy: 0.05
    max-copies: 4
  efficiency:
    enabled: true
    per-copy: 0.04
    max-copies: 4
  preservation:
    enabled: true
    per-copy: 0.05
    max-copies: 4
  insight:
    enabled: true
    per-copy: 0.05
    max-copies: 4
  reach:
    enabled: true
    per-copy: 0.05  # +0.05 blocks melee/entity reach each roll; up to +0.15
    max-copies: 3
  scale:
    enabled: true
    per-copy: 0.05  # -5% player size and hitbox per copy; up to -15%
    max-copies: 3
  capacity:
    enabled: true
    per-copy: 4  # +4 items in each naturally stackable inventory slot
    max-copies: 4  # 64 -> 68 -> 72 -> 76 -> 80

legendary:
  enabled: true
  # Old Skript weapons have lore tags rather than PDC IDs. Keep this on during
  # migration, then run /spreeadmin migrateitems and disable it.
  accept-legacy-lore-items: true
  crafting-enabled: true
  prevent-storage: true
  forging:
    duration-seconds: 900
    coordinate-broadcast-seconds: 180
    announce-death-of-holder: true
    # A forge keeps counting down while its owner is offline. They can collect on join.
  weapons:
    tundra:
      cooldown-seconds: 40
      arm-seconds: 8
      freeze-seconds: 2
      passive-chance: 0.07
      slow-seconds: 2
    butcherer:
      cooldown-seconds: 35
      sacrifice-hearts: 5
      strength-level: 3
      strength-seconds: 10
      wither-chance: 0.05
      wither-level: 3
      wither-seconds: 2
    stormbreaker:
      cooldown-seconds: 55
      active-radius: 6
      active-damage-hearts: 3
      launch-velocity: 0.8
      passive-chance: 0.10
      passive-extra-damage-hearts: 1.5
    aquafier:
      cooldown-seconds: 60
      absorb-search-radius: 8
      absorb-blocks-max: 65
      active-seconds: 15
      speed-level: 3
      active-damage-multiplier: 1.20
      combo-window-seconds: 2
      combo-hit-count: 4
      drowning-damage-hearts: 3.5
    darkheart:
      cooldown-seconds: 15
      dash-ticks: 6
      dash-speed: 0.9
      dash-radius: 1.8
      dash-damage-hearts: 3.5
      lifedrain-hits: 4
      lifedrain-hearts: 2
    hailstorm:
      cooldown-seconds: 30
      arm-seconds: 30
      frost-every-shots: 3
      frost-level: 3
      frost-seconds: 3
      volley-arrows: 10
      volley-interval-ticks: 10
      volley-damage-hearts: 0.5
      replenished-arrows: true
    bloodsbane:
      minimum-leader-streak: 15
      cooldown-seconds: 55
      arm-seconds: 8
      combo-reset-seconds: 7
      combo-per-hit: 0.04
      combo-max-stacks: 10
      launch-ticks-between-hits: 10
      launch-hits: 6
      launch-damage-per-hit-hearts: 0.75

# These options are visible and editable in /spree settings > Combat Balancing.
# Multipliers apply to the unmitigated base damage, before armor/enchantments.
combat:
  mace:
    enabled: true
    player-damage-multiplier: 0.75
  tnt:
    enabled: true
    igniter-self-damage-multiplier: 0.50
  explosive-kill-credit:
    enabled: true
    window-seconds: 12

# Untimed locator / hunt / juggernaut events are separate from 5-minute mini events.
events:
  hunt:
    target-kill-bonus: 2
    hunter-kill-bonus: 3
  juggernaut:
    bonus-hearts: 10
    kill-bonus: 2
    slay-bonus: 4
  timed:
    default-seconds: 300
    bloodmoon:
      extra-streak-per-kill: 1
    # Spree Surge is paused pending the killstreak progression redesign.
    chaos:
      minimum-streak: 10
      cooldown-multiplier: 0.70
    race:
      kills-to-win: 3
      winner-bonus: 3

# Client-only textures: vanilla item_model remains unchanged. No resource pack = vanilla models.
# Merge the optional SpreeCore resource-pack bridge JSON files into your own pack.
# If you modify a numeric selector here, you must match it in the pack JSON.
resource-pack:
  enabled: true
  models:
    tundra: 721001
    butcherer: 721002
    stormbreaker: 721003
    aquafier: 721004
    darkheart: 721005
    hailstorm: 721006
    bloodsbane: 721007
    token: 721050
