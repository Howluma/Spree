# SpreeCore 1.8.5 - Flame Rod Talent replaces Barbed Hook with burning TNT-igniting bobbers.
# Save changes automatically from the menu; manual edits use /spreeadmin reload.
# Values labeled hearts use Minecraft HEARTS (two health points per heart).
general:
  prefix: '&9&lSPREE &8| &f'
  # Technical score ceiling (not a progression limit). Past level 30, the
  # displayed killstreak, personal best and leaderboards keep increasing.
  # Health, perks, talents, infusions, privileges and reward tiers stop at 30.
  max-killstreak: 1000000000
  fractured-label: '&c&lFractured'
  actionbar-interval-ticks: 40
  save-interval-seconds: 120
  announce-joining-streak: 10

# Blue (&9) sword symbol matches menu headings; bold number colors change every five kills.
# Overhead tags use scoreboard suffixes when the player is NOT already in a team.
# Existing faction/party team membership is preserved (no forced team removal).
display:
  streak-indicators:
    tab-enabled: true
    # While the Invisibility potion effect is active, the tab list keeps the
    # last shown killstreak until the effect ends. Actual streak mechanics continue.
    freeze-tab-while-invisible: true
    nametag-enabled: true
    symbol: '⚔'
    fractured-symbol: '✕'
    # Original Spree Skript thresholds; editable in /spree settings.
    # Numbers are always bold; only their colors vary.
    tier-colors:
      '0': '&7'  # 0-4 gray
      '5': '&a'  # 5-9 green
      '10': '&e' # 10-14 yellow
      '15': '&6' # 15-19 gold
      '20': '&c' # 20-24 red
      '25': '&5' # 25-29 purple
      '30': '&4' # 30+ dark red

killstreak:
  # Vanilla is 10 hearts. Only the first 30 positive levels grant +0.5 heart each.
  # Fractured (-1) is treated as 0 here: no health penalty.
  base-health-hearts: 10
  health-per-level-hearts: 0.5
  # The mace now requires a redeemed Mace Wielder Privilege.
  # PvP kill rewards scale with the VICTIM'S streak before death.
  # 0-4 => +1; 5-9 => +2; 10-14 => +3; ... 25-29 => +6; 30+ => +7.
  # Applies to qualifying melee, ranged, and player-credited explosive kills.
  # Environmental-death tokens award the SAME tier payout as player kills;
  # environmental death still halves the victim's current killstreak.
  kill-rewards:
    base-reward: 1
    levels-per-tier: 5
    extra-per-tier: 1
  # Infusions are selected in /spree > Progression, not automatically granted.
  # Convert owned streak levels into right-click +1 Spree items.
  withdrawal:
    enabled: true
  anti-farm:
    enabled: true
    same-victim-cooldown-seconds: 300
    block-rewards-for-fractured-victim: true
  # Retained only for legacy configurations; unwanted revenge rewards are OFF.
  revenge:
    enabled: false
    bonus-streak: 2
  # Privileges, Talents, Infusions are manually chosen in /spree > Progression.
  # Only minor Perks roll and apply automatically.

# Wanted status announces each five levels and adds escalating target penalties.
hunt:
  glowing-level: 10
  coordinates-level: 15
  coordinate-interval-minutes: 15
  no-teams-level: 20
  announcements:
    '5': '&9&lSPREE &8| &a{player} is on fire! &7(5 killstreak)'
    '10': '&9&lSPREE &8| &e{player} is unstoppable! &7(10 killstreak)'
    '15': '&9&lSPREE &8| &6{player} is being hunted! &7(15 killstreak)'
    '20': '&9&lSPREE &8| &c{player} is a lone wolf! &7(20 killstreak)'
    '25': '&9&lSPREE &8| &5{player} is most wanted! &7(25 killstreak)'
    '30': '&9&lSPREE &8| &4{player} has become legendary! &7(30 killstreak)'

# Fate Sigil crafting and appearance: Ominous Trial Keys on the corners,
# Netherite Ingots on the four edges, and a genuine Spree consumable in the center.
# SPREE_ITEM checks SpreeCore's internal item tag; a plain Heart of the Sea will NOT work.
# All nine slots remain editable in the
# /spree > Admin Center > Balance Workshop > Fate Sigil Recipe panel.
fate-sigil:
  display-name: '&9&lFate Sigil'
  recipe:
    enabled: true
    result-amount: 1
    slot-1: OMINOUS_TRIAL_KEY
    slot-2: NETHERITE_INGOT
    slot-3: OMINOUS_TRIAL_KEY
    slot-4: NETHERITE_INGOT
    slot-5: SPREE_ITEM
    slot-6: NETHERITE_INGOT
    slot-7: OMINOUS_TRIAL_KEY
    slot-8: NETHERITE_INGOT
    slot-9: OMINOUS_TRIAL_KEY

# These item limits are visible in the operator settings GUI.
privileges:
  max-totems: 1
  max-enchanted-apples: 4
  enchanted-apple-cooldown-seconds: 30
  enchanted-apple-max-effect-seconds: 60
  max-wind-charges: 64
  max-experience-bottles: 64

# Configurable Talent values. Each subsection has its own settings screen.
talents:
  # Owner hears a distinct cue, sees a short particle burst, and receives an
  # action-bar label when a Talent actually procs. Cooldown alerts are sent only
  # once, when the Talent becomes usable again; never every heartbeat.
  feedback:
    enabled: true
    sounds: true
    particles: true
    actionbar: true
    ready-notifications: true
    ready-chat: true
    passive-interval-ms: 2500
  defense:
    shared-cooldown-seconds: 10
  executioner:
    health-threshold-fraction: 0.50
    bonus-damage-fraction: 0.10
  combo-breaker:
    hits-required: 3
    window-seconds: 5
    bonus-damage-fraction: 0.10
  concussive-blow:
    cooldown-seconds: 45
    duration-seconds: 5
  sunder:
    cooldown-seconds: 45
    extra-shield-disable-ticks: 30
  riposte:
    cooldown-seconds: 45
    duration-seconds: 2
  bloodlust:
    hits-required: 5
    heal-hearts: 1.0
    cooldown-seconds: 15
  second-wind:
    health-threshold-fraction: 0.30
    duration-seconds: 8
    cooldown-seconds: 90
  iron-will:
    trigger-hearts: 3.0
    duration-seconds: 5
    cooldown-seconds: 75
  field-medic:
    heal-hearts: 5.0
    cooldown-seconds: 60
  golden-aegis:
    extra-absorption-hearts: 2
    cooldown-seconds: 45
  scavenger:
    chance: 0.15
    wind-charges: 4
    cooldown-seconds: 90
  battle-sense:
    duration-seconds: 8
  acrobat:
    fall-damage-multiplier: 0.60
    jump-bonus-fraction: 0.10
  trailblazer:
    step-height-addition: 0.40
  windrunner:
    velocity-multiplier: 1.25
  escape-artist:
    cooldown-seconds: 50
  expanded-reserves:
    extra-items: 64
  quick-hands:
    # 0.90 = consume food and potions in 10% less time.
    consume-time-multiplier: 0.90
  flame-rod:
    enabled: true
    # Held fishing rods temporarily get Flame I, reverting when dropped or traded.
    # The bobber visually burns and emits flame particles while the cast is active.
    bobber-particles: true
    cast-sound: true
    # Ignite TNT only when the bobber touches the block, not at a distance.
    contact-tolerance: 0.35
    max-ignitions-per-cast: 1
    tnt-fuse-ticks: 80
  streak-insurance:
    cooldown-seconds: 600
    protected-levels: 2

# Two Perk rolls per 5 levels (2, 4, 7, 9, ...).
# Each milestone's roll is stored permanently in players.yml, never rerolled.
# An assigned Perk is active only while the player's current streak reaches
# that exact milestone. Duplicates stack additively up to max-copies.
# 'per-copy' is a FRACTION (0.02 = 2%), except reach (blocks/copy).
perks:
  enabled: true
  power:
    enabled: true
    per-copy: 0.02
    max-copies: 4
  fortitude:
    enabled: true
    per-copy: 0.02
    max-copies: 4
  agility:
    enabled: true
    per-copy: 0.03
    max-copies: 3
  dexterity:
    enabled: true
    per-copy: 0.02
    max-copies: 4
  restoration:
    enabled: true
    per-copy: 0.03
    max-copies: 4
  stability:
    enabled: true
    per-copy: 0.04
    max-copies: 4
  endurance:
    enabled: true
    per-copy: 0.05
    max-copies: 4
  efficiency:
    enabled: true
    per-copy: 0.04
    max-copies: 4
  preservation:
    enabled: true
    per-copy: 0.05
    max-copies: 4
  insight:
    enabled: true
    per-copy: 0.05
    max-copies: 4
  reach:
    enabled: true
    per-copy: 0.05  # +0.05 blocks melee/entity reach each roll; up to +0.15
    max-copies: 3
  scale:
    enabled: true
    per-copy: 0.05  # -5% player size and hitbox per copy; up to -15%
    max-copies: 3
  capacity:
    enabled: true
    per-copy: 4  # +4 items in each naturally stackable inventory slot
    max-copies: 4  # 64 -> 68 -> 72 -> 76 -> 80
  alchemy:
    enabled: true
    per-copy: 0.05  # +5% duration for beneficial potions/food per roll
    max-copies: 4  # +20% maximum; excludes permanent Infusions

legendary:
  enabled: true
  # Old Skript weapons have lore tags rather than PDC IDs. Keep this on during
  # migration, then run /spreeadmin migrateitems and disable it.
  accept-legacy-lore-items: true
  crafting-enabled: true
  prevent-storage: true
  forging:
    duration-seconds: 900
    coordinate-broadcast-seconds: 180
    announce-death-of-holder: true
    # A forge keeps counting down while its owner is offline. They can collect on join.
  weapons:
    tundra:
      cooldown-seconds: 40
      arm-seconds: 8
      freeze-seconds: 2
      passive-chance: 0.07
      slow-seconds: 2
    butcherer:
      cooldown-seconds: 35
      sacrifice-hearts: 5
      strength-level: 3
      strength-seconds: 10
      wither-chance: 0.05
      wither-level: 3
      wither-seconds: 2
    stormbreaker:
      cooldown-seconds: 55
      active-radius: 6
      active-damage-hearts: 3
      launch-velocity: 0.8
      passive-chance: 0.10
      passive-extra-damage-hearts: 1.5
    aquafier:
      cooldown-seconds: 60
      absorb-search-radius: 8
      absorb-blocks-max: 65
      active-seconds: 15
      speed-level: 3
      active-damage-multiplier: 1.20
      combo-window-seconds: 2
      combo-hit-count: 4
      drowning-damage-hearts: 3.5
    darkheart:
      cooldown-seconds: 15
      dash-ticks: 6
      dash-speed: 0.9
      dash-radius: 1.8
      dash-damage-hearts: 3.5
      lifedrain-hits: 4
      lifedrain-hearts: 2
    hailstorm:
      cooldown-seconds: 30
      arm-seconds: 30
      frost-every-shots: 3
      frost-level: 3
      frost-seconds: 3
      volley-arrows: 10
      volley-interval-ticks: 10
      volley-damage-hearts: 0.5
      replenished-arrows: true
    bloodsbane:
      minimum-leader-streak: 15
      cooldown-seconds: 55
      arm-seconds: 8
      combo-reset-seconds: 7
      combo-per-hit: 0.04
      combo-max-stacks: 10
      launch-ticks-between-hits: 10
      launch-hits: 6
      launch-damage-per-hit-hearts: 0.75

# These options are visible and editable in /spree settings > Combat Balancing.
# Multipliers apply to the unmitigated base damage, before armor/enchantments.
combat:
  mace:
    enabled: true
    player-damage-multiplier: 0.75
    # Only actual, unblocked smash damage starts the cooldown.
    # Normal mace swings, misses, and blocked attacks do not start it.
    slam-cooldown-seconds: 60
    mastery-slam-cooldown-seconds: 30
    # Vanilla shaded hotbar overlay after a real mace smash. Normal hits remain usable.
    cooldown-overlay: true
    # Extra blue shockwave at impact visible to nearby players.
    impact-particles: true
    impact-sound: true
  tnt:
    enabled: true
    igniter-self-damage-multiplier: 0.50
  # Player combat credit also carries through short follow-up environmental deaths
  # (fall, lava, fire, void, drowning, suffocation, etc.). Those deaths reward
  # the credited killer and NEVER spawn an environmental-death Spree Token.
  pvp-environment-credit:
    enabled: true
    window-seconds: 12
  explosive-kill-credit:
    enabled: true
    window-seconds: 12

# Untimed locator / hunt / juggernaut events are separate from 5-minute mini events.
events:
  hunt:
    target-kill-bonus: 2
    hunter-kill-bonus: 3
  juggernaut:
    bonus-hearts: 10
    kill-bonus: 2
    slay-bonus: 4
  timed:
    default-seconds: 300
    bloodmoon:
      extra-streak-per-kill: 1
    # Spree Surge is paused pending the killstreak progression redesign.
    chaos:
      minimum-streak: 10
      cooldown-multiplier: 0.70
    race:
      kills-to-win: 3
      winner-bonus: 3

# Client-only textures: vanilla item_model remains unchanged. No resource pack = vanilla models.
# Merge the optional SpreeCore resource-pack bridge JSON files into your own pack.
# If you modify a numeric selector here, you must match it in the pack JSON.
resource-pack:
  enabled: true
  models:
    tundra: 721001
    butcherer: 721002
    stormbreaker: 721003
    aquafier: 721004
    darkheart: 721005
    hailstorm: 721006
    bloodsbane: 721007
    token: 721050
    fate-sigil: 721051
