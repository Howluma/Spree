name: SpreeCore
version: 1.8.2
main: dev.howluma.spreecore.SpreeCorePlugin
api-version: '1.21.11'
authors: [Howluma]
description: Native Paper rewrite of Spree SMP killstreaks, events, tokens and legendary weapons.
commands:
  spree:
    description: Open the Spree menu or withdraw killstreak into Spree items
    usage: '/spree [perks|withdraw [amount|all]]'
  spreesettings:
    description: Open the admin settings editor directly
    permission: spree.admin
    aliases: [spreeconfig]
  spreeset:
    aliases: [setspree]
    permission: spree.admin
    description: Set a saved player's exact killstreak (also works while offline)
    usage: '/spreeset <player> <value>'
  spreesetall:
    aliases: [setallspree]
    permission: spree.admin
    description: Set every saved player's killstreak without resetting their progression
    usage: '/spreesetall <value>'
  fatesigil:
    aliases: [givesigil]
    permission: spree.admin
    description: Give yourself or another online player authentic Fate Sigils
    usage: '/fatesigil [amount] or /fatesigil give <player> [amount]'
  spreehud:
    aliases: [togglehud]
    description: Toggle killstreak action bar
  killstreak:
    aliases: [ks]
    description: Check current killstreak
  stats:
    aliases: [stat, statistics, mystats]
    description: View player stats
  leaderboard:
    aliases: [lb, topstreak, streaktop]
    description: Show killstreak leaderboard
  spreeinfo:
    description: Show active thresholds and effects
  spreeadmin:
    aliases: [sa]
    permission: spree.admin
    description: Admin player management, import, and plugin reload
  spreeevent:
    permission: spree.admin
    description: Control hunt, juggernaut, locator, Blood's Bane, and timed events
  legendary:
    aliases: [relic]
    description: Administer legendary weapons and forges
permissions:
  spree.withdraw:
    description: Withdraw owned streak levels to Spree items
    default: true
  spree.admin:
    description: Manage all Spree systems
    default: op
  spree.legendary.give:
    description: Spawn legendary test items
    default: op
